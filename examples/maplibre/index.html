<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobilithek MapLibre Example</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside class="panel">
      <header class="panel-header">
        <p class="eyebrow">Karte.Bayern Mobilithek Demo</p>
        <h1>Mobilithek Meldungen</h1>
        <p class="notice">Veralteter, statischer Datenabruf – nur zu Demonstrationszwecken.</p>
        <p id="status" role="status" aria-live="polite">Lade echte Beispielmeldungen...</p>
      </header>

      <dl class="summary" aria-label="Meldungsübersicht">
        <div>
          <dt>Sichtbar</dt>
          <dd id="visible-count">0</dd>
        </div>
        <div>
          <dt>Aktuell</dt>
          <dd id="current-count">0</dd>
        </div>
        <div>
          <dt>Geplant</dt>
          <dd id="future-count">0</dd>
        </div>
      </dl>

      <div class="toolbar" aria-label="Meldungen filtern">
        <label class="search-label">
          Suche
          <input id="search-filter" type="search" placeholder="Ort, Straße, Richtung">
        </label>
        <label>
          Straße
          <select id="road-filter">
            <option value="">Alle</option>
          </select>
        </label>
        <label>
          Status
          <select id="status-filter">
            <option value="">Alle</option>
            <option value="current">Aktuell</option>
            <option value="future">Geplant</option>
          </select>
        </label>
        <button id="reset-filters" class="reset-button" type="button">Zurücksetzen</button>
      </div>

      <ol id="event-list" class="event-list"></ol>

      <footer class="panel-footer">
        <a href="https://verkehr.autobahn.de/o/autobahn/" rel="noreferrer">Autobahn-App API</a>
        · <a href="https://mobilithek.info/" rel="noreferrer">Mobilithek</a>
        · <a href="https://karte.bayern/" rel="noreferrer">Karte.Bayern</a>
      </footer>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
    <script src="app.js"></script>
  </body>
</html>
