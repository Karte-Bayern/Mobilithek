<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mobilithek MapLibre Example</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <aside class="panel">
      <h1>Mobilithek Meldungen</h1>
      <p id="status">Lade echte Beispielmeldungen...</p>
      <div class="toolbar" aria-label="Filter">
        <label>
          Straße
          <select id="road-filter">
            <option value="">Alle</option>
          </select>
        </label>
        <label>
          Status
          <select id="status-filter">
            <option value="">Alle</option>
            <option value="current">Aktuell</option>
            <option value="future">Geplant</option>
          </select>
        </label>
      </div>
      <ol id="event-list" class="event-list"></ol>
    </aside>
    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="app.js"></script>
  </body>
</html>
